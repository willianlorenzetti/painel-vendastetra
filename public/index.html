<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Tetra | Vendas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-title">
        <img src="logo.png" alt="Dovale" class="header-logo" />
        <div>
          <h1>Painel de Vendas - Chave Tetra</h1>
          <p id="header-sync">—</p>
        </div>
      </div>

      <div class="header-filters">
        <!-- Atualizar -->
        <button class="btn-refresh" id="btn-refresh" title="Atualizar dados">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          Atualizar
        </button>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- ERROS -->
    <div id="alert-errors" class="alert hidden"></div>

    <!-- KPI CARDS -->
    <section class="kpi-grid">

      <!-- % principal -->
      <div class="kpi-card kpi-card--feature">
        <div class="kpi-icon kpi-icon--blue">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="5" x2="5" y2="19"/>
            <circle cx="6.5" cy="6.5" r="2.5"/>
            <circle cx="17.5" cy="17.5" r="2.5"/>
          </svg>
        </div>
        <div class="kpi-body">
          <span class="kpi-label">Clientes com 10+ Tetras</span>
          <span class="kpi-value kpi-value--xl" id="kpi-pct-meta">—%</span>
          <div class="progress-bar-wrap">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          </div>
          <span class="kpi-sub" id="kpi-sub-meta">— de — clientes no período</span>
        </div>
      </div>

      <!-- Clientes com 10+ tetras (contagem) -->
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon--blue">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="kpi-body">
          <span class="kpi-label">Clientes com 10+ Tetras</span>
          <span class="kpi-value" id="kpi-com-tetra">—</span>
          <span class="kpi-sub" id="kpi-sub-periodo">de — no período</span>
        </div>
      </div>

      <!-- Qtde tetra -->
      <div class="kpi-card">
        <div class="kpi-icon kpi-icon--teal">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
          </svg>
        </div>
        <div class="kpi-body">
          <span class="kpi-label">Total Tetra Vendidas</span>
          <span class="kpi-value" id="kpi-total-qtde">—</span>
          <span class="kpi-sub">unidades</span>
        </div>
      </div>


    </section>

    <!-- TABLE -->
    <div class="table-wrap">
      <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <span>Carregando dados...</span>
      </div>
      <div id="empty-state" class="empty-state hidden">Nenhum dado encontrado para o período.</div>
      <table id="data-table" class="data-table hidden">
        <thead>
          <tr>
            <th class="th-rank">#</th>
            <th class="sortable" data-col="rep_nome">Vendedor</th>
            <th class="sortable th-center" data-col="total">Total de Clientes</th>
            <th class="sortable th-center" data-col="meta">Clientes com 10+ Tetras</th>
            <th class="sortable th-center" data-col="pct">% com 10+ Tetras</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
