<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes | Outras Chaves</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-title">
        <img src="logo.png" alt="Dovale" class="header-logo" />
        <div>
          <h1>Detalhes - Outras Chaves</h1>
          <p id="header-sync">—</p>
        </div>
      </div>

      <div class="header-filters">
        <div class="date-filter">
          <label for="input-date">Campanha</label>
          <input type="text" id="input-date" value="14/07/2026 a 17/07/2026"
                 maxlength="25" readonly />
        </div>

        <button class="btn-refresh" id="btn-refresh" title="Atualizar dados">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
          Atualizar
        </button>

        <a class="btn-refresh" href="index.html" title="Voltar ao ranking">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Ranking
        </a>
      </div>
    </div>
  </header>

  <main class="main">

    <!-- ERROS -->
    <div id="alert-errors" class="alert hidden"></div>

    <!-- RESUMO POR VENDEDORA -->
    <div class="table-wrap">
      <div class="section-title">Meta x Vendido por vendedora — clique numa vendedora para ver os pedidos dela</div>
      <div id="vend-loading" class="loading-state">
        <div class="spinner"></div>
        <span>Carregando dados...</span>
      </div>
      <table id="vend-table" class="data-table hidden">
        <thead>
          <tr>
            <th class="th-rank">#</th>
            <th class="sortable" data-col="rep_nome">Vendedor</th>
            <th class="sortable th-center" data-col="meta">Meta</th>
            <th class="sortable th-center" data-col="vendido">Vendido</th>
            <th class="sortable th-center" data-col="pct">% da Meta</th>
          </tr>
        </thead>
        <tbody id="vend-body"></tbody>
      </table>
    </div>

  </main>

  <script src="detalhes.js"></script>
</body>
</html>
